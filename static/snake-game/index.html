<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1e1e2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
  }
  .wrap {
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
    color: #a6e3a1;
    letter-spacing: 2px;
  }
  #score {
    font-size: 20px;
    margin-bottom: 10px;
  }
  canvas {
    background: #11111b;
    border: 3px solid #a6e3a1;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(166,227,161,0.4);
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.75);
    flex-direction: column;
  }
  #overlay h2 {
    color: #f38ba8;
    font-size: 36px;
    margin-bottom: 10px;
  }
  #overlay p {
    color: #eee;
    margin-bottom: 20px;
  }
  button {
    background: #a6e3a1;
    border: none;
    padding: 10px 24px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover {
    background: #94d491;
  }
  .hint {
    margin-top: 10px;
    font-size: 13px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🐍 SNAKE</h1>
    <div id="score">Score: 0 &nbsp;|&nbsp; High Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="hint">Arrow keys / WASD to move &middot; Space to pause</div>
  </div>

  <div id="overlay">
    <h2>Game Over</h2>
    <p id="finalScore">Score: 0</p>
    <button id="restartBtn">Restart</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, direction, nextDirection, food, score, highScore, gameOver, paused, speedMs, gameLoopId;

highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);

function resetGame() {
  snake = [{ x: 10, y: 10 }];
  direction = { x: 0, y: 0 };
  nextDirection = { x: 0, y: 0 };
  score = 0;
  gameOver = false;
  paused = false;
  speedMs = 110;
  placeFood();
  updateScore();
  document.getElementById('overlay').style.display = 'none';
  if (gameLoopId) clearInterval(gameLoopId);
  gameLoopId = setInterval(tick, speedMs);
}

function placeFood() {
  let valid = false;
  while (!valid) {
    food = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    valid = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function updateScore() {
  document.getElementById('score').textContent =
    `Score: ${score}  |  High Score: ${highScore}`;
}

function tick() {
  if (gameOver || paused) return;

  // prevent reversing directly into itself
  if (!(nextDirection.x === -direction.x && nextDirection.y === -direction.y) ||
      (direction.x === 0 && direction.y === 0)) {
    direction = nextDirection;
  }

  if (direction.x === 0 && direction.y === 0) {
    draw();
    return;
  }

  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  // wall collision
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    return endGame();
  }
  // self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
    }
    updateScore();
    placeFood();
    // speed up slightly, capped
    if (speedMs > 60) {
      speedMs -= 2;
      clearInterval(gameLoopId);
      gameLoopId = setInterval(tick, speedMs);
    }
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  gameOver = true;
  clearInterval(gameLoopId);
  document.getElementById('finalScore').textContent = `Score: ${score}`;
  document.getElementById('overlay').style.display = 'flex';
}

function draw() {
  ctx.fillStyle = '#11111b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = '#f38ba8';
  ctx.beginPath();
  ctx.arc(
    food.x * gridSize + gridSize / 2,
    food.y * gridSize + gridSize / 2,
    gridSize / 2 - 2, 0, Math.PI * 2
  );
  ctx.fill();

  // snake
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#a6e3a1' : '#7fbf7a';
    ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);
  });
}

document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === ' ') {
    if (!gameOver) paused = !paused;
    e.preventDefault();
    return;
  }
  const map = {
    arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
    arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
    arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
    arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 },
  };
  if (map[key]) {
    nextDirection = map[key];
    e.preventDefault();
  }
});

document.getElementById('restartBtn').addEventListener('click', resetGame);

resetGame();
</script>
</body>
</html>
